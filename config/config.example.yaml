# KrakenBase configuration example
# Copy to config.yaml and adjust for your site.

system:
  name: "KrakenBase-Primary"
  site_id: "patrol-base-01"
  log_level: INFO
  data_dir: "/var/lib/krakenbase"
  audit_db: "/var/lib/krakenbase/events.db"

kraken:
  host: "127.0.0.1"
  doa_port: 8081
  settings_port: 8081
  poll_interval_s: 0.5
  min_confidence: 70.0
  request_timeout_s: 2.0
  control_method: "settings_json"

array:
  type: "UCA"
  radius_m: 0.15
  heading_offset_deg: 0.0
  element_order: [0, 1, 2, 3, 4]

baseline:
  enabled: true
  bands:
    - name: "VHF"
      start_hz: 136000000
      stop_hz: 174000000
      bin_hz: 25000
    - name: "UHF"
      start_hz: 400000000
      stop_hz: 470000000
      bin_hz: 25000
    - name: "GMRS"
      start_hz: 462500000
      stop_hz: 467700000
      bin_hz: 12500
  update_interval_s: 30
  anomaly_margin_db: 10.0
  min_anomaly_duration_s: 2.0
  rearm_s: 300.0
  power_source: "kraken"

dwell:
  default_s: 2.5
  max_s: 5.0
  settle_s: 1.0
  max_readings: 5

alert:
  meshtastic:
    enabled: true
    interface: "/dev/ttyUSB0"
    channel_index: 0
    rate_limit_s: 60
  local:
    enabled: true

handoff:
  enabled: true
  transport: "file"
  mqtt:
    host: "127.0.0.1"
    port: 1883
    topic: "krakenbase/handoff"
  defaults:
    priority: 5
    max_dwell_min: 30
    record_iq: false
    # target_node_id: "ugs-west-gate"

rff:
  enabled: false
  sensor_id: "none"
  recipe_id: "none"

status_api:
  host: "127.0.0.1"
  port: 8090

roe:
  version: "0.1"
  require_audit: true
  allow_tx: false
